<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECOBET – Momentum / Last 5 Hotfix Loader</title>
<style>
  html,body{margin:0;min-height:100%;background:#081015;color:#e9f2f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .boot{max-width:760px;margin:10vh auto;padding:24px;border:1px solid #25404c;border-radius:18px;background:#0e1a21}
  .boot h1{margin:0 0 10px;font-size:1.25rem}
  .boot p{color:#91a7b1;line-height:1.55}
  .ok{color:#31e6a1}.bad{color:#ff6577}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
</head>
<body>
<div class="boot" id="boot">
  <h1>ECOBET Momentum / Last 5 Hotfix</h1>
  <p>Die bestehende ECOBET V2.2L wird geladen und ausschliesslich an zwei Stellen gepatcht:
  Matchdetails erhalten wieder <b>Team Momentum · Last 5</b>, und beim Öffnen eines Matches
  werden die Auditdaten vor dem finalen Detail-Render geladen.</p>
  <p id="status">Basis wird geladen …</p>
</div>

<script>
(async function(){
  const status = document.getElementById('status');

  // Commit-pinned basis: current production HTML before this hotfix.
  // Dadurch lädt diese Ersatzdatei NICHT sich selbst, nachdem sie als index.html hochgeladen wurde.
  const BASE =
    'https://raw.githubusercontent.com/Giammaa87/ecobet/6aa510d9f270fbefc81c9efc6e5c1a5391c5f6a3/index.html';

  try {
    const response = await fetch(BASE, {cache:'no-store'});
    if (!response.ok) throw new Error('Basis-HTML HTTP ' + response.status);

    let source = await response.text();
    let patches = 0;

    // FIX 1:
    // Team Momentum + die fünf HIT/MISS/PUSH-Punkte wieder direkt in den Matchdetails anzeigen.
    const detailNeedle =
      '<div class="chips"><span class="chip ${chipClass(m.data_readiness)}">${show(m.data_readiness)}</span><span class="chip ${chipClass(m.world_stability)}">${show(m.world_stability)}</span><span class="chip">${show(m.world_type)}</span></div></div><section class="decision-card panel">';

    const detailReplacement =
      '<div class="chips"><span class="chip ${chipClass(m.data_readiness)}">${show(m.data_readiness)}</span><span class="chip ${chipClass(m.world_stability)}">${show(m.world_stability)}</span><span class="chip">${show(m.world_type)}</span></div></div><section class="cluster panel"><h3 style="margin-top:0">Team Momentum · Last 5</h3>${runMomentumPair(m)}</section><section class="decision-card panel">';

    if (source.includes(detailNeedle)) {
      source = source.replace(detailNeedle, detailReplacement);
      patches++;
    } else {
      throw new Error('Detail-Renderstelle nicht gefunden – Hotfix wurde NICHT angewendet.');
    }

    // FIX 2:
    // Beim ersten Öffnen kann auditCache noch leer sein. Snapshot + Audit-Historie gemeinsam laden
    // und danach das Detail nochmals rendern. Damit erscheinen Momentum und Last-5-Punkte zuverlässig.
    const loadNeedle =
      'if(sync)syncURL();hydrateMatchSnapshot(m).then(()=>{';

    const loadReplacement =
      'if(sync)syncURL();Promise.all([hydrateMatchSnapshot(m),ensureAuditData().catch(e=>{console.warn("Momentum audit fallback failed",e);return []})]).then(()=>{';

    if (source.includes(loadNeedle)) {
      source = source.replace(loadNeedle, loadReplacement);
      patches++;
    } else {
      throw new Error('OpenDetail-Ladestelle nicht gefunden – Hotfix wurde NICHT angewendet.');
    }

    if (patches !== 2) throw new Error('Unerwartete Patch-Anzahl: ' + patches);

    // Identifikationsmarker, ohne die bestehende Versionslogik zu verändern.
    source = source.replace(
      '</head>',
      '<!-- ECOBET HOTFIX 2026-09-06: restore Team Momentum + Last 5 in match details -->\n</head>'
    );

    // Vollständige gepatchte ECOBET-Seite in dieses Dokument einsetzen.
    document.open();
    document.write(source);
    document.close();

  } catch (err) {
    console.error(err);
    status.className = 'bad';
    status.textContent = 'Hotfix konnte nicht gestartet werden: ' + (err && err.message ? err.message : String(err));
  }
})();
</script>
</body>
</html>
