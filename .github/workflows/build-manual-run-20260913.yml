          if len({m['fixture_id'] for m in matches})!=14: errors.append('duplicate_fixture_id')
          if {m['fixture_id'] for m in matches}!=fixture_ids: errors.append('fixture_set_mismatch')
          for m in matches:
              for k in required:
                  if k not in m or m[k] in (None,''): errors.append(f'{m.get("fixture_id")} missing {k}')
              so=m['reasoning_provenance']['structured_stage_outputs']
              if list(so.keys())!=stages: errors.append(f'{m["fixture_id"]} stage_order_or_set')
              if m['data_snapshot_id']!=SID: errors.append(f'{m["fixture_id"]} snapshot_binding')
              if m['reasoning_provenance'].get('raw_chain_of_thought_stored') is not False: errors.append(f'{m["fixture_id"]} cot_flag')
              ta=so['TEAM_EBOOK_A_BUILD'].get('team_ebook') if isinstance(so['TEAM_EBOOK_A_BUILD'],dict) else None
              tb=so['TEAM_EBOOK_B_BUILD'].get('team_ebook') if isinstance(so['TEAM_EBOOK_B_BUILD'],dict) else None
              if not isinstance(ta,dict) or not isinstance(tb,dict): errors.append(f'{m["fixture_id"]} ebook_missing')
