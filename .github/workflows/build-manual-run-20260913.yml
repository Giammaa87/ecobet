          audit_path=Path('audits/manual_run_audit_2026-09-13.json'); audit_path.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          idx_path=Path('runs/index.json'); idx=json.loads(idx_path.read_text(encoding='utf-8')); idx['generated_at']=now.isoformat(); idx.setdefault('dates',{}).setdefault(DATE,[])
          if run_id not in idx['dates'][DATE]: idx['dates'][DATE].append(run_id)
          idx_path.write_text(json.dumps(idx,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('audits/manual_run_pointer_2026-09-13.json').write_text(json.dumps({'run_id':run_id,'run_file':str(outfile),'audit_file':str(audit_path),'status':'APPROVED'},indent=2)+'\n',encoding='utf-8')
          print(json.dumps(audit,ensure_ascii=False,indent=2)); print('RUN_BYTES',outfile.stat().st_size)
          PY

      - name: Validate generated JSON and index binding
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          ptr=json.loads(Path('audits/manual_run_pointer_2026-09-13.json').read_text())
          run=json.loads(Path(ptr['run_file']).read_text(encoding='utf-8'))
          audit=json.loads(Path(ptr['audit_file']).read_text(encoding='utf-8'))
          idx=json.loads(Path('runs/index.json').read_text(encoding='utf-8'))
          assert audit['status']=='APPROVED' and audit['publication_gate']=='PASS'
          assert len(run['matches'])==14
          assert ptr['run_id'] in idx['dates']['2026-09-13']
          assert run['proof_of_work']['team_ebooks_built']==28
          assert run['proof_of_work']['match_ebooks_built']==14
          assert run['run']['official_production_run'] is False
          print('FINAL_GATE PASS',ptr['run_id'])
          PY

      - name: Remove temporary scaffolding
        shell: bash
        run: |
          rm -f \
            .github/workflows/manual-clubelo-table-20260913.yml \
            .github/workflows/manual-input-20260913.yml \
            .github/workflows/manual-summary-20260913.yml \
            .github/workflows/build-manual-run-20260913.yml \
            audits/manual_clubelo_table_2026-09-13.csv \
            audits/manual_clubelo_meta_2026-09-13.json \
            audits/manual_input_2026-09-13.json \
            audits/manual_summary_2026-09-13.csv

      - name: Commit approved run, audit, index and cleanup
        shell: bash
        run: |
          git config user.name 'ecobet-manual-run-bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          git add -A
          RUN_ID=$(python3 -c "import json;print(json.load(open('audits/manual_run_pointer_2026-09-13.json'))['run_id'])")
          git diff --cached --quiet && exit 0
          git commit -m "Publish gated ECOBET manual run ${RUN_ID}"
          git push
