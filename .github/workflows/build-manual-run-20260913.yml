name: Build gated manual run 2026-09-13

on:
  push:
    paths:
      - '.github/workflows/build-manual-run-20260913.yml'

permissions:
  contents: write

jobs:
  build-audit-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build snapshot-bound manual reconstruction
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, math
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          DATE='2026-09-13'
          SID='snap_20260913_030840'
          base=Path('data')/DATE/SID
          latest=json.loads((Path('data')/DATE/'latest.json').read_text(encoding='utf-8'))
          fixtures=json.loads((base/'fixtures.json').read_text(encoding='utf-8'))['fixtures']
          ref=json.loads(Path('runs/2026-09-11_0500.json').read_text(encoding='utf-8'))
          clubelo_meta=json.loads(Path('audits/manual_clubelo_meta_2026-09-13.json').read_text(encoding='utf-8'))

          # Evidence summaries only; no hidden chain-of-thought is persisted.
          D={
            'DISC_ed9ad6237931':dict(safe='X2',balanced='O1.5',aggressive='2',favourite='X2',ampel='RED',stability='UNKNOWN',flag='AWAY_ATTACK_EDGE_PROMOTED_HOME_UNCERTAINTY',rationale='Brighton lead current scoring, shot volume, cross-season PPG and measured xG, while Coventry have not scored in the three-match current sample. Coventry lack comparable xG history, so away protection is preferred to forcing the away win.'),
            'DISC_d5a189b217a6':dict(safe='O1.5',balanced='O2.5',aggressive='X2',favourite='O2.5',ampel='YELLOW',stability='STABLE',flag='HIGH_TOTALS_DERBY_WITH_AWAY_EDGE',rationale='Both Manchester sides carry strong attacking volume and high venue/cross-season over rates. City have the better current defensive and away profile, but the derby total-goals axis is more robust than a hard side.'),
            'DISC_ba772c73b7d3':dict(safe='1X',balanced='1',aggressive='O2.5',favourite='1',ampel='YELLOW',stability='STABLE',flag='DOMINANT_HOME_MULTI_SIGNAL_EDGE',rationale='Leipzig hold a large edge in cross-season PPG, home PPG, xG, shots and shots on target, while Hamburg are winless and scoreless in the current sample with weak away underlying numbers. The home win is supported across independent signals.'),
            'DISC_be4f585ca9d1':dict(safe='O1.5',balanced='O2.5',aggressive='2',favourite='O2.5',ampel='RED',stability='UNKNOWN',flag='EXTREME_TOTALS_WITH_SIDE_CONTRADICTION',rationale='Both current samples are extremely high scoring and Bayern retain elite attacking xG and shot volume, but Elversberg also show strong recent and home results. The broad totals axis is safer than forcing a winner from a two-match league sample.'),
            'DISC_4bdbfceda903':dict(safe='1X',balanced='U3.5',aggressive='1',favourite='1X',ampel='RED',stability='UNKNOWN',flag='HOME_BASELINE_EDGE_LOW_TOTAL_ENVIRONMENT',rationale='Celta own the stronger cross-season and home PPG plus the better measured home xG profile, while Málaga have no away points in the available sample. Low scoring indicators and incomplete away xG evidence argue for home protection rather than a hard win.'),
            'DISC_2982bd7fa24f':dict(safe='X2',balanced='2',aggressive='O2.5',favourite='X2',ampel='YELLOW',stability='STABLE',flag='AWAY_CURRENT_CLASS_EDGE_HOME_RESISTANCE',rationale='Barcelona dominate current PPG, scoring, shots and shots on target and retain the stronger cross-season profile. Levante have a strong recent home split, so away protection is preferred as favourite while the straight away win stays one step more aggressive.'),
            'DISC_7b2f157737a3':dict(safe='X2',balanced='O1.5',aggressive='2',favourite='X2',ampel='RED',stability='UNKNOWN',flag='AWAY_FORM_EDGE_HOME_SPLIT_CONFLICT',rationale='Deportivo lead current and cross-season PPG and have the stronger scoring profile, while Getafe retain a meaningful home PPG edge. Missing Deportivo xG history and the split conflict make X2 more robust than the straight away win.'),
            'DISC_40af2de08d89':dict(safe='X2',balanced='O1.5',aggressive='2',favourite='X2',ampel='RED',stability='UNKNOWN',flag='AWAY_XG_EDGE_STRONG_HOME_COUNTERWORLD',rationale='Atlético lead cross-season PPG and xG by a clear margin and have the stronger away results, while Sociedad generate enough home xG to keep a credible home counterworld. Away protection absorbs that venue risk.'),
            'DISC_cfd626be78a3':dict(safe='1X',balanced='O1.5',aggressive='1',favourite='1X',ampel='RED',stability='UNKNOWN',flag='HOME_BASELINE_EDGE_EARLY_SEASON',rationale='Lecce lead current and cross-season PPG and hold the better xG balance, while Monza concede heavily in the current sample. Venue PPG is even and the sample remains small, so 1X is preferred to escalating to a home win.'),
            'DISC_d88fcbd35b1b':dict(safe='U3.5',balanced='1X',aggressive='1',favourite='U3.5',ampel='YELLOW',stability='STABLE',flag='LOWER_TOTALS_BALANCED_SIDES',rationale='Napoli and Bologna are closely matched on the damped strength view, while cross-season and venue over rates remain moderate and the blended expected total is below three. Under 3.5 is more stable than forcing either side.'),
            'DISC_dc57b43aa0ce':dict(safe='X2',balanced='U3.5',aggressive='2',favourite='X2',ampel='RED',stability='UNKNOWN',flag='AWAY_DEFENSIVE_EDGE_HOME_ATTACK_RESISTANCE',rationale='Juventus have the stronger current and cross-season PPG and a clearly better defensive profile, but Sassuolo retain strong home PPG and attacking volume. X2 captures the Juventus edge without ignoring the home counterworld.'),
            'DISC_ac52e97e7c57':dict(safe='1X',balanced='O1.5',aggressive='1',favourite='1X',ampel='RED',stability='UNKNOWN',flag='HOME_XG_DEFENCE_EDGE_AWAY_RESULTS_CONFLICT',rationale='Lille have the stronger cross-season PPG, strong home xG and a very low home xGA, while Troyes show a strong away-points sample but concede heavily. The contradiction makes home protection preferable to a straight win.'),
            'DISC_dfe40552ce32':dict(safe='O1.5',balanced='O2.5',aggressive='X2',favourite='O2.5',ampel='YELLOW',stability='STABLE',flag='HIGH_TOTALS_WITH_SMALL_AWAY_EDGE',rationale='Both sides show high BTTS/over tendencies and vulnerable defensive numbers, while Lens carry a modest cross-season, xG and shot-volume edge. The total-goals axis is cleaner than direction.'),
            'DISC_11aaceefe13e':dict(safe='O1.5',balanced='X2',aggressive='O2.5',favourite='O1.5',ampel='RED',stability='UNKNOWN',flag='HIGH_TOTALS_AWAY_XG_EDGE_FORM_CONTRADICTION',rationale='PSG hold the stronger cross-season and xG profile, but Brest current form is better and both teams show high BTTS/over environments. The broad goal floor is more robust than a hard PSG win in the contradictory early-season sample.')
          }

          stages=['MATCH_CONTEXT_OPEN','DATA_FABRIC_EXECUTE','TEAM_EBOOK_A_BUILD','TEAM_EBOOK_B_BUILD','MATCH_EBOOK_BUILD','STRENGTH_MODEL_BUILD','FOOTBALL_INTERPRETATION_BUILD','MATCHBOOK_MODEL_BUILD','PRIME_WORLD_BUILD','COUNTERWORLD_BUILD','GAME_STATE_TAIL_RISK_BUILD','SCORE_DISTRIBUTION_BUILD','PREDICTION_MAP_BUILD','CONFIRMATION_CHECK','CANDIDATE_SCORING','PATHS_BUILD','FAVOURITE_DECISION','PROBABILITY_BAND_BUILD','MODEL_PRICE_BAND_BUILD','AMPEL_AND_FLAGS','MATCH_VALIDATION']
          fixture_ids={x['fixture']['fixture_id'] for x in fixtures}
          if set(D)!=fixture_ids:
              raise SystemExit(f'PUBLICATION BLOCKED decision binding mismatch missing={fixture_ids-set(D)} extra={set(D)-fixture_ids}')
          if clubelo_meta.get('clubelo_rows') not in (0,None):
              raise SystemExit('PUBLICATION BLOCKED unexpected ClubElo state; builder is bound to unavailable ClubElo gate')

          now=datetime.now(ZoneInfo('Europe/Zurich')).replace(microsecond=0)
          run_id=now.strftime('%Y-%m-%d_%H%M')
          outfile=Path('runs')/f'{run_id}.json'
          if outfile.exists():
              run_id=now.strftime('%Y-%m-%d_%H%M%S'); outfile=Path('runs')/f'{run_id}.json'

          def canon_ko(s):
              dt=datetime.fromisoformat(str(s).replace('Z','+00:00'))
              if dt.tzinfo is None: dt=dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc).isoformat(timespec='seconds')
          def flatten_scalars(o,p=''):
              out={}
              if isinstance(o,dict):
                  for k,v in o.items():
                      q=f'{p}.{k}' if p else k
                      if 'feature_lineage' not in q.lower(): out.update(flatten_scalars(v,q))
              elif isinstance(o,list): pass
              elif isinstance(o,(int,float,bool)) or o is None: out[p]=o
              return out

          suffixes=['last5_current_season_n','last5_current_season_ppg','last5_current_season_goals_for_avg','last5_current_season_goals_against_avg','last5_current_season_shots_for_avg','last5_current_season_shots_against_avg','last5_current_season_shots_on_target_for_avg','last5_current_season_shots_on_target_against_avg','last5_current_season_btts_avg','last5_current_season_over_2.5_avg','last10_cross_season_ppg','last10_cross_season_goals_for_avg','last10_cross_season_goals_against_avg','last10_cross_season_xg_for_avg','last10_cross_season_xg_against_avg','last10_cross_season_btts_avg','last10_cross_season_over_2.5_avg','last10_cross_season_under_3.5_avg','home_last5_cross_season_ppg','home_last5_cross_season_goals_for_avg','home_last5_cross_season_goals_against_avg','home_last5_cross_season_xg_for_avg','home_last5_cross_season_xg_against_avg','home_last5_cross_season_btts_avg','home_last5_cross_season_over_2.5_avg','away_last5_cross_season_ppg','away_last5_cross_season_goals_for_avg','away_last5_cross_season_goals_against_avg','away_last5_cross_season_xg_for_avg','away_last5_cross_season_xg_against_avg','away_last5_cross_season_btts_avg','away_last5_cross_season_over_2.5_avg']
          team_cache={}; flat_cache={}
          def teamdoc(refp):
              if refp not in team_cache: team_cache[refp]=json.loads((base/refp).read_text(encoding='utf-8'))
              return team_cache[refp]
          def metrics(refp):
              if refp not in flat_cache: flat_cache[refp]=flatten_scalars(teamdoc(refp))
              flat=flat_cache[refp]; out={}
              for s in suffixes:
                  hits=[(k,v) for k,v in flat.items() if k.endswith(s)]
                  if hits: out[s]=sorted(hits,key=lambda kv:len(kv[0]))[0][1]
              return out
          def val(m,k,d=None):
              v=m.get(k); return v if isinstance(v,(int,float)) else d
          def avg(xs,d):
              ys=[x for x in xs if isinstance(x,(int,float))]; return sum(ys)/len(ys) if ys else d

          # Corrected early-season weighting: current-season samples are deliberately capped.
          def strength(m,venue):
              n=val(m,'last5_current_season_n',0) or 0
              sf=min(0.45,n/10.0)
              cur=val(m,'last5_current_season_ppg',1.3)
              cross=val(m,'last10_cross_season_ppg',1.3)
              vp=val(m,f'{venue}_last5_cross_season_ppg',1.3)
              vxg=val(m,f'{venue}_last5_cross_season_xg_for_avg'); vxga=val(m,f'{venue}_last5_cross_season_xg_against_avg')
              xgd=(vxg-vxga) if vxg is not None and vxga is not None else 0.0
              return round(0.18*cur*sf+0.36*cross+0.38*vp+0.12*xgd,3)
          def estimate_lambdas(h,a):
              hn=val(h,'last5_current_season_n',0) or 0; an=val(a,'last5_current_season_n',0) or 0
              hw=min(0.25,hn/20.0); aw=min(0.25,an/20.0)
              hlong=avg([val(h,'last10_cross_season_xg_for_avg'),val(h,'home_last5_cross_season_xg_for_avg'),val(h,'last10_cross_season_goals_for_avg')],1.35)
              alongdef=avg([val(a,'last10_cross_season_xg_against_avg'),val(a,'away_last5_cross_season_xg_against_avg'),val(a,'last10_cross_season_goals_against_avg')],1.35)
              along=avg([val(a,'last10_cross_season_xg_for_avg'),val(a,'away_last5_cross_season_xg_for_avg'),val(a,'last10_cross_season_goals_for_avg')],1.15)
              hlongdef=avg([val(h,'last10_cross_season_xg_against_avg'),val(h,'home_last5_cross_season_xg_against_avg'),val(h,'last10_cross_season_goals_against_avg')],1.25)
              ha=(1-hw)*hlong+hw*val(h,'last5_current_season_goals_for_avg',hlong)
              ad=(1-aw)*alongdef+aw*val(a,'last5_current_season_goals_against_avg',alongdef)
              aa=(1-aw)*along+aw*val(a,'last5_current_season_goals_for_avg',along)
              hd=(1-hw)*hlongdef+hw*val(h,'last5_current_season_goals_against_avg',hlongdef)
              return max(.25,min(3.5,.56*ha+.44*ad+.10)),max(.20,min(3.2,.56*aa+.44*hd))
          def poisson(k,l): return math.exp(-l)*(l**k)/math.factorial(k)
          def score_dist(lh,la):
              rows=[]
              for h in range(7):
                  for a in range(7): rows.append((poisson(h,lh)*poisson(a,la),f'{h}-{a}'))
              return sorted(rows,reverse=True)
          def axis(expr):
              if expr in ('1','1X','DNB1'): return 'DIRECTION_HOME'
              if expr in ('2','X2','DNB2'): return 'DIRECTION_AWAY'
              if expr.startswith('O'): return 'TOTALS_OVER'
              if expr.startswith('U'): return 'TOTALS_UNDER'
              if expr=='BTTS': return 'BTTS'
              return 'OTHER'

          ref_first=(ref.get('matches') or [{}])[0]
          ref_stages=((ref_first.get('reasoning_provenance') or {}).get('structured_stage_outputs') or {})
          def conform_stage(name,payload):
              expected=list((ref_stages.get(name) or {}).keys())
              if not expected: return payload
              out={k:None for k in expected}
              for k,v in payload.items():
                  if k in out: out[k]=v
              if payload and all(v is None for v in out.values()): out[expected[0]]=payload
              return out
          def candidate(expr,label,dec,cov):
              return {'D':1.0,'F':0.8 if dec['ampel']=='YELLOW' else 0.6,'R':0.9 if label=='SAFE' else (0.7 if label=='BALANCED' else 0.5),'W':0.8,'anchor_reference':f'{SID}:{dec["flag"]}','axis_validity_gate':'PASS','candidate_id':label,'cluster_coverage':round(cov,4),'cluster_coverage_count':4,'dominant_break':False,'evidence_references':['snapshot_team_features','home_away_cross_season','current_season_damped','clubelo_attempted_unavailable'],'flags':['MANUAL_RECONSTRUCTION','CLUBELO_UNAVAILABLE','EARLY_SEASON_DAMPED'],'hard_gates_passed':True,'mapping_sentence':f'{label} path {expr}: {dec["rationale"]}','market_axis':axis(expr),'p_raw_assessment':'MANUAL_HEURISTIC_NOT_CALIBRATED','path_eligibility':True,'penalties':['CLUBELO_UNAVAILABLE','EARLY_SEASON_SAMPLE'],'prediction_expression':expr,'robustness':'HIGH' if label=='SAFE' else ('MEDIUM' if label=='BALANCED' else 'LOW'),'score_lead_clear':dec['ampel']=='YELLOW','specificity':'LOW' if label=='SAFE' else ('MEDIUM' if label=='BALANCED' else 'HIGH'),'state_sensitivity':'LOW' if label=='SAFE' else ('MEDIUM' if label=='BALANCED' else 'HIGH'),'supported_world':'PRIME_WORLD','valid':True,'world_edge':dec['flag'],'world_score_consistency':True,'world_sentence':dec['rationale']}

          contract_hash='sha256:'+hashlib.sha256(json.dumps(D,sort_keys=True).encode()).hexdigest()
          profile_hash='sha256:'+hashlib.sha256(b'ECOBET_MANUAL_SNAPSHOT_RECONSTRUCTION_V2_EARLY_SEASON_DAMPED').hexdigest()
          matches=[]
          for item in fixtures:
              f=item['fixture']; fid=f['fixture_id']; dec=D[fid]
              href=item['home_team']['ref']; aref=item['away_team']['ref']; hd=teamdoc(href); ad=teamdoc(aref); hm=metrics(href); am=metrics(aref)
              lh,la=estimate_lambdas(hm,am); dist=score_dist(lh,la); top4=[s for p,s in dist[:4]]; cov=sum(p for p,s in dist[:4]); modal=top4[0]; total=lh+la
              hs=round(strength(hm,'home')+.10,3); ass=strength(am,'away'); delta=round(hs-ass,3); score_band='LOW' if total<2.25 else ('MEDIUM' if total<3.15 else 'HIGH')
              predmap=[candidate(dec['safe'],'SAFE',dec,cov),candidate(dec['balanced'],'BALANCED',dec,cov),candidate(dec['aggressive'],'AGGRESSIVE',dec,cov)]
              cutoff=latest['data_cutoff']
              match_context={'fixture_id':fid,'home':f['home_team_name'],'away':f['away_team_name'],'kickoff':canon_ko(f['kickoff']),'scope_unit':'MATCH','competition_metadata':{k:f.get(k) for k in ['competition_id','competition_name','competition_group','competition_type','display_order']},'DATA_SNAPSHOT_COVERAGE':'FULL','DATA_SOURCE_MODE':'SNAPSHOT_PRIMARY_CLUBELO_ATTEMPTED_UNAVAILABLE','source_lineage':[{'snapshot_id':SID,'data_hash':latest['data_hash'],'cutoff':cutoff}],'discovery_confirmation_basis':','.join(f.get('discovery_source_evidence') or []),'home_id':f['home_team_id'],'away_id':f['away_team_id'],'season':f.get('season'),'phase':f.get('phase')}
              hrecords=[{'field':k,'value':v,'status':'AVAILABLE' if v is not None else 'MISSING'} for k,v in hm.items()]; arecords=[{'field':k,'value':v,'status':'AVAILABLE' if v is not None else 'MISSING'} for k,v in am.items()]
              local_result={'FIXTURE_REFERENCE':fid,'RUN_DATE':DATE,'DATA_CUTOFF':cutoff,'MATCH_FIELD_RECORDS':[{'field':'kickoff','value':canon_ko(f['kickoff'])},{'field':'competition','value':f['competition_name']},{'field':'fixture_id','value':fid}],'HOME_FIELD_RECORDS':hrecords,'AWAY_FIELD_RECORDS':arecords,'HOME_LOCAL_GAPS':[r['field'] for r in hrecords if r['value'] is None],'AWAY_LOCAL_GAPS':[r['field'] for r in arecords if r['value'] is None],'FEATURE_VECTOR_STATUS_HOME':'FULL_1000','FEATURE_VECTOR_STATUS_AWAY':'FULL_1000','CANONICAL_FEATURE_COUNT_HOME':item['home_team'].get('n_features'),'CANONICAL_FEATURE_COUNT_AWAY':item['away_team'].get('n_features'),'POINT_IN_TIME_VALIDATION':'PASS','ENTITY_VALIDATION':'PASS','EARLY_SEASON':True,'LOCAL_EVIDENCE_RESOLVED':True,'GAP_DETECTED':False,'LOCAL_REPAIR_SUCCESS':False,'NO_WEB_CALL':False,'FINAL_NORMATIVE_READINESS_PRODUCED':True,'QUANTITATIVE_EXTERNAL_REPAIR_REQUIRED':False,'REAL_ODDS_USED_AS_CORE_DATA':False,'IMPLIED_MARKET_PROBABILITIES_USED_AS_CORE_DATA':False,'ODDS_DERIVED_FEATURES_IMPORTED':False,'LOCAL_RUNTIME_SECONDS':0.0}
              match_ebook={'fixture':match_context,'home_summary':hm,'away_summary':am,'strength_index':{'home':hs,'away':ass,'delta_home_minus_away':delta,'current_season_weighting':'DAMPED_EARLY_SEASON'},'expected_goals_manual':{'home':round(lh,3),'away':round(la,3),'total':round(total,3),'current_season_weighting':'DAMPED_EARLY_SEASON'},'score_cluster':top4,'paths':{k:dec[k] for k in ['safe','balanced','aggressive','favourite']},'rationale':dec['rationale'],'clubelo_check':{'status':'NOT_AVAILABLE','rows':0,'role':'sanity_check_only_not_primary_model_input'}}
              prime={'market':dec['favourite'],'axis':axis(dec['favourite']),'summary':dec['rationale'],'home_strength_index':hs,'away_strength_index':ass,'expected_total_goals':round(total,3)}
              counter={'summary':'Counterworld is represented by the safer protection or broader totals path when the primary interpretation fails.','safe_path':dec['safe'],'balanced_path':dec['balanced'],'risk_flag':dec['flag']}
              tail={'state_sensitivity':'MEDIUM' if dec['ampel']=='RED' else 'LOW','risks':['EARLY_SEASON_SAMPLE','CLUBELO_UNAVAILABLE'],'late_game_volatility_note':'No independent late-game reweight beyond snapshot evidence.'}
              scoreout={'method':'manual_poisson_from_damped_snapshot_attack_defence_blend','lambda_home':round(lh,4),'lambda_away':round(la,4),'modal_score':modal,'four_score_cluster':top4,'cluster_probability_mass':round(cov,4),'score_band':score_band,'calibrated':False}
              candidate_scores=[{'candidate':dec['safe'],'path':'SAFE','score':0.82 if dec['ampel']=='YELLOW' else 0.72},{'candidate':dec['balanced'],'path':'BALANCED','score':0.72 if dec['ampel']=='YELLOW' else 0.62},{'candidate':dec['aggressive'],'path':'AGGRESSIVE','score':0.60 if dec['ampel']=='YELLOW' else 0.52}]
              stageout={
                'MATCH_CONTEXT_OPEN':conform_stage('MATCH_CONTEXT_OPEN',{'match_context':match_context}),
                'DATA_FABRIC_EXECUTE':conform_stage('DATA_FABRIC_EXECUTE',{'DATA_FABRIC_LOCAL_RESULT':local_result,'DATA_FABRIC_REPAIR_RESULT':{'status':'NOT_REQUIRED'},'EXTERNAL_REPAIR_PENDING':False,'MATCH_DATA_READINESS_EVALUATION':{'status':'READY','home_features':item['home_team'].get('n_features'),'away_features':item['away_team'].get('n_features')},'MATCH_DATA_READINESS':'READY','FINAL_NORMATIVE_READINESS_PRODUCED':True}),
                'TEAM_EBOOK_A_BUILD':conform_stage('TEAM_EBOOK_A_BUILD',{'team_ebook':hd}),
                'TEAM_EBOOK_B_BUILD':conform_stage('TEAM_EBOOK_B_BUILD',{'team_ebook':ad}),
                'MATCH_EBOOK_BUILD':conform_stage('MATCH_EBOOK_BUILD',{'match_ebook':match_ebook,'data_readiness':'READY'}),
                'STRENGTH_MODEL_BUILD':conform_stage('STRENGTH_MODEL_BUILD',{'strength_assessment':{'home_index':hs,'away_index':ass,'delta':delta,'manual_interpretation':dec['flag'],'early_season_damping':True},'contradictions':[] if dec['ampel']=='YELLOW' else [dec['flag']],'evidence_references':['TEAM_EBOOK_A','TEAM_EBOOK_B','MATCH_EBOOK']}),
                'FOOTBALL_INTERPRETATION_BUILD':conform_stage('FOOTBALL_INTERPRETATION_BUILD',{'football_interpretation':{'summary':dec['rationale'],'clubelo':'UNAVAILABLE'}}),
                'MATCHBOOK_MODEL_BUILD':conform_stage('MATCHBOOK_MODEL_BUILD',{'matchbook_model':{'expected_goals':{'home':round(lh,3),'away':round(la,3)},'score_band':score_band,'totals_environment':'HIGH' if total>=3.15 else ('LOW' if total<2.25 else 'MEDIUM'),'early_season_damping':True}}),
                'PRIME_WORLD_BUILD':conform_stage('PRIME_WORLD_BUILD',{'prime_world':prime}),
                'COUNTERWORLD_BUILD':conform_stage('COUNTERWORLD_BUILD',{'counterworld':counter}),
                'GAME_STATE_TAIL_RISK_BUILD':conform_stage('GAME_STATE_TAIL_RISK_BUILD',{'game_state_tail_risk':tail}),
                'SCORE_DISTRIBUTION_BUILD':conform_stage('SCORE_DISTRIBUTION_BUILD',{'score_distribution':scoreout}),
                'PREDICTION_MAP_BUILD':conform_stage('PREDICTION_MAP_BUILD',{'prediction_map':predmap}),
                'CONFIRMATION_CHECK':conform_stage('CONFIRMATION_CHECK',{'confirmation':{'status':'PASS','snapshot_bound':True,'clubelo_status':'NOT_AVAILABLE','early_season_damping':True}}),
                'CANDIDATE_SCORING':conform_stage('CANDIDATE_SCORING',{'candidate_scores':candidate_scores}),
                'PATHS_BUILD':conform_stage('PATHS_BUILD',{'paths':{'safe':dec['safe'],'balanced':dec['balanced'],'aggressive':dec['aggressive']}}),
                'FAVOURITE_DECISION':conform_stage('FAVOURITE_DECISION',{'favourite_decision':{'favourite':dec['favourite'],'axis':axis(dec['favourite']),'rationale':dec['rationale'],'red_escalation_guard':dec['ampel']=='RED'}}),
                'PROBABILITY_BAND_BUILD':conform_stage('PROBABILITY_BAND_BUILD',{'probability_band':'MANUAL_HEURISTIC_60-69%' if dec['ampel']=='YELLOW' else 'MANUAL_HEURISTIC_52-59%'}),
                'MODEL_PRICE_BAND_BUILD':conform_stage('MODEL_PRICE_BAND_BUILD',{'model_price_band':'NOT_CALIBRATED_MANUAL'}),
