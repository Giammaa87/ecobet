              m={'fixture_id':fid,'kickoff':canon_ko(f['kickoff']),'competition':f['competition_name'],'competition_id':f['competition_id'],'competition_name':f['competition_name'],'competition_group':f['competition_group'],'competition_type':f['competition_type'],'display_order':f.get('display_order'),'phase':f.get('phase'),'home':f['home_team_name'],'away':f['away_team_name'],'data_snapshot_id':SID,'data_snapshot_coverage':'FULL','data_source_mode':'SNAPSHOT_PRIMARY_CLUBELO_ATTEMPTED_UNAVAILABLE','snapshot_fixture_missing':False,'world_type':'PRIME_PLUS_COUNTERWORLD','safe':dec['safe'],'balanced':dec['balanced'],'aggressive':dec['aggressive'],'favourite':dec['favourite'],'model_probability_band':'MANUAL_HEURISTIC_60-69%' if dec['ampel']=='YELLOW' else 'MANUAL_HEURISTIC_52-59%','model_price_band':'NOT_CALIBRATED_MANUAL','world_stability':dec['stability'],'ampel':dec['ampel'],'flags':['MANUAL_RECONSTRUCTION','SNAPSHOT_BOUND','EARLY_SEASON_DAMPED','CLUBELO_UNAVAILABLE',dec['flag']],'data_readiness':'READY','match_core_status':'MODELED','nsp_codes':[],'board_status':'COMMITTED','confirmation_status':'CONFIRMED_MANUAL','commit_status':'COMMITTED','commit_time':now.isoformat(),'match_validation':'PASS','modal_score':modal,'four_score_cluster':top4,'score_band':score_band,'prediction_map':predmap,'reasoning_provenance':rp}
              matches.append(m)

          scope=[]
          for f in fixtures:
              n=f['fixture']['competition_name']
              if n not in scope: scope.append(n)
          pow={'matches_opened':len(matches),'data_fabric_executed':len(matches),'team_ebooks_built':len(matches)*2,'match_ebooks_built':len(matches),'strength_models_built':len(matches),'football_interpretations_built':len(matches),'matchbook_models_built':len(matches),'prime_worlds_built':len(matches),'counterworlds_built':len(matches),'score_distributions_built':len(matches),'prediction_maps_built':len(matches),'matches_validated':len(matches),'ampel_distribution':dict(Counter(m['ampel'] for m in matches)),'world_stability_distribution':dict(Counter(m['world_stability'] for m in matches)),'clubelo_status':'NOT_AVAILABLE','early_season_damping':True}
          doc={'schema_version':'1.3','record_type':'assistant_snapshot_prediction_run','run':{'run_id':run_id,'snapshot_id':SID,'snapshot_time':latest['generated_at'],'date':DATE,'timezone':'Europe/Zurich','scope':scope,'build_mode':'MANUAL_SNAPSHOT_RECONSTRUCTION','audit_mode':'PRE_PUBLISH_GATED','run_status':'APPROVED_MANUAL_RECONSTRUCTION','processing_status':'COMPLETE','n_fixtures':len(matches),'zero_fixture_basis':'NOT_APPLICABLE','run_integrity':'PASS','output_integrity':'PASS','norm_versions':{'MASTER_OS':'1.5','DATA_FABRIC_AND_EBOOKS':'1.7','OUTPUT_AND_AUDIT':'1.3'},'data_snapshot_status':'AVAILABLE','data_snapshot_id':SID,'data_snapshot_date':DATE,'data_snapshot_generated_at':latest['generated_at'],'data_snapshot_data_cutoff':latest['data_cutoff'],'data_snapshot_db_updated_at':latest.get('db_updated_at'),'data_snapshot_hash':latest['data_hash'],'data_snapshot_schema_version':latest['schema_version'],'data_snapshot_url':f'https://github.com/Giammaa87/ecobet/tree/main/data/{DATE}/{SID}','official_production_run':False},'matches':matches,'proof_of_work':pow}

          required=['fixture_id','kickoff','home','away','safe','balanced','aggressive','favourite','ampel','prediction_map','reasoning_provenance','modal_score','four_score_cluster']
