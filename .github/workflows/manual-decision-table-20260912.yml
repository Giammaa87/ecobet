name: One-time manual decision table 2026-09-12

on:
  push:
    paths:
      - '.github/workflows/manual-decision-table-20260912.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tiny decision table with snapshot Elo
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          date='2026-09-12'; sid='snap_20260912_030836'; base=Path('data')/date/sid
          fx=json.loads((base/'fixtures.json').read_text(encoding='utf-8'))['fixtures']

          def flatten(o,p=''):
              out={}
              if isinstance(o,dict):
                  for k,v in o.items():
                      q=f'{p}.{k}' if p else k
                      out.update(flatten(v,q))
              elif isinstance(o,list):
                  pass
              elif isinstance(o,(str,int,float,bool)) or o is None:
                  out[p]=o
              return out

          wanted=[
            'last5_current_season_n','last5_current_season_ppg','last5_current_season_goals_for_avg','last5_current_season_goals_against_avg','last5_current_season_shots_for_avg','last5_current_season_shots_against_avg','last5_current_season_shots_on_target_for_avg','last5_current_season_shots_on_target_against_avg','last5_current_season_btts_avg','last5_current_season_over_2.5_avg',
            'last10_cross_season_ppg','last10_cross_season_goals_for_avg','last10_cross_season_goals_against_avg','last10_cross_season_xg_for_avg','last10_cross_season_xg_against_avg','last10_cross_season_btts_avg','last10_cross_season_over_2.5_avg','last10_cross_season_under_3.5_avg',
            'home_last5_cross_season_ppg','home_last5_cross_season_goals_for_avg','home_last5_cross_season_goals_against_avg','home_last5_cross_season_xg_for_avg','home_last5_cross_season_xg_against_avg','home_last5_cross_season_btts_avg','home_last5_cross_season_over_2.5_avg',
            'away_last5_cross_season_ppg','away_last5_cross_season_goals_for_avg','away_last5_cross_season_goals_against_avg','away_last5_cross_season_xg_for_avg','away_last5_cross_season_xg_against_avg','away_last5_cross_season_btts_avg','away_last5_cross_season_over_2.5_avg'
          ]
          cache={}
          def team(ref,venue):
              if ref in cache: flat=cache[ref]
              else:
                  doc=json.loads((base/ref).read_text(encoding='utf-8'))
                  flat=flatten(doc); cache[ref]=flat
              m={}
              for s in wanted:
                  hits=[(k,v) for k,v in flat.items() if 'feature_lineage' not in k.lower() and k.endswith(s)]
                  if hits: m[s]=sorted(hits,key=lambda x:len(x[0]))[0][1]
              elo={k:v for k,v in flat.items() if 'feature_lineage' not in k.lower() and 'elo' in k.lower() and isinstance(v,(int,float,str))}
              # Limit to likely rating fields, preserving exact paths for auditability.
              elo=dict(list(sorted(elo.items()))[:30])
              return {'metrics':m,'elo':elo}

          rows=[]
          for item in fx:
              f=item['fixture']; h=item['home_team']; a=item['away_team']
              rows.append({
                'id':f['fixture_id'],'ko':f['kickoff'],'comp':f['competition_name'],'home':f['home_team_name'],'away':f['away_team_name'],
                'H':team(h['ref'],'home'),'A':team(a['ref'],'away')
              })
          out={'status':'PASS','snapshot_id':sid,'count':len(rows),'rows':rows}
          p=Path('audits/manual_decision_table_2026-09-12.json')
          p.write_text(json.dumps(out,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          print('rows',len(rows),'bytes',p.stat().st_size)
          if len(rows)!=25: raise SystemExit('expected 25')
          PY
      - name: Commit decision table
        shell: bash
        run: |
          git config user.name 'ecobet-manual-run-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add audits/manual_decision_table_2026-09-12.json
          git diff --cached --quiet && exit 0
          git commit -m 'Build 2026-09-12 manual decision table with snapshot Elo'
          git push
