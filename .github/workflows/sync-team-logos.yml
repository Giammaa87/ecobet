name: Sync ECOBET team logos

on:
  push:
    branches:
      - team-logos-2026-27
    paths:
      - logos/scripts/sync_team_logos.py
      - .github/workflows/sync-team-logos.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: team-logos-2026-27
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and map club crests
        run: python logos/scripts/sync_team_logos.py
      - name: Commit generated logo library
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos/assets/team-logos
          if git diff --cached --quiet; then
            echo "No logo changes."
            exit 0
          fi
          git commit -m "Update 2026-27 team logo library"
          git push origin HEAD:team-logos-2026-27
