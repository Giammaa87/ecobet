name: ECOBET automatic result audit recovery

on:
  schedule:
    - cron: '20 1,5,10 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audits/ECOBET_*_RESULT_AUDIT_V24.json'
      - 'audits/index.json'

permissions:
  contents: write

concurrency:
  group: ecobet-website-derived-indexes-main
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate recovery script
        run: |
          python -m py_compile tools/reconcile_result_audits.py
          python -m unittest discover -s tools/tests -p 'test_result_audit_recovery.py' -v
      - name: Reconcile, rebuild indexes and publish with concurrent push recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ecobet-audit-recovery-bot'
          git config user.email 'ecobet-audit-recovery-bot@users.noreply.github.com'

          # Other publishers (run, odds, audit, extension tasks) advance main at any time.  Every attempt
          # starts from the newest main, recomputes the append-only revision against it and never force pushes.
          for attempt in 1 2 3 4 5; do
            echo "Audit recovery publish attempt ${attempt}/5"
            git fetch --no-tags origin main
            git reset --hard origin/main
            git clean -fd -- audits performance team-form

            python tools/reconcile_result_audits.py . --lookback-days 7
            python tools/build_website_phase1_indexes.py .
            python tools/validate_website_phase1.py .
            git add -- audits performance team-form

            if git diff --cached --quiet; then
              echo 'No changes to publish.'
              exit 0
            fi
            git commit -m 'audit: reconcile completed results and refresh indexes'
            if git push origin HEAD:main; then
              echo 'Audit revisions and indexes published.'
              exit 0
            fi
            echo "::warning::main changed during audit recovery; recomputing from the newest main"
            sleep "$((attempt * 2))"
          done
          echo "::error::Unable to publish audit recovery after 5 attempts"
          exit 1
