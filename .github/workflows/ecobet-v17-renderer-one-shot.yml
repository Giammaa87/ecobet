name: ECOBET one-shot Data Fabric v1.7 renderer patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ecobet-v17-renderer-one-shot.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/data-fabric-v17-renderer
          fetch-depth: 0

      - name: Apply guarded renderer patch
        run: python tools/patch_v17_renderer.py

      - name: Validate and commit branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'function renderDataFabric(m,fs)' index.html >/dev/null
          grep -F 'Data Fabric · Signalblöcke / Compatibility' index.html >/dev/null
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          a = s.rfind('<script>')
          b = s.rfind('</script>')
          if a < 0 or b <= a:
              raise SystemExit('script block not found')
          Path('/tmp/ecobet-inline.js').write_text(s[a+8:b], encoding='utf-8')
          PY
          node --check /tmp/ecobet-inline.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f tools/patch_v17_renderer.py .github/workflows/ecobet-v17-renderer-one-shot.yml
          git commit -m "Update Team E-Books and Data Fabric v1.7 renderer"
          git push origin HEAD:fix/data-fabric-v17-renderer
