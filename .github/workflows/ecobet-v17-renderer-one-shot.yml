name: ECOBET one-shot Data Fabric v1.7 renderer patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ecobet-v17-renderer-one-shot.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/data-fabric-v17-renderer
          fetch-depth: 0

      - name: Apply guarded renderer patch
        run: python tools/patch_v17_renderer.py

      - name: Validate and commit branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'function renderDataFabric(m,fs)' index.html >/dev/null
          grep -F 'Data Fabric · Signalblöcke / Compatibility' index.html >/dev/null
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.in_script = False
                  self.current = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script':
                      self.in_script = True
                      self.current = []
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.in_script:
                      self.scripts.append(''.join(self.current))
                      self.in_script = False
              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)

          parser = ScriptParser()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          scripts = [x for x in parser.scripts if x.strip()]
          if not scripts:
              raise SystemExit('no inline scripts found')
          app = max(scripts, key=len)
          if 'function renderDataFabric(m,fs)' not in app:
              raise SystemExit('patched app script not found')
          Path('/tmp/ecobet-inline.js').write_text(app, encoding='utf-8')
          PY
          node --check /tmp/ecobet-inline.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f tools/patch_v17_renderer.py .github/workflows/ecobet-v17-renderer-one-shot.yml
          git commit -m "Update Team E-Books and Data Fabric v1.7 renderer"
          git push origin HEAD:fix/data-fabric-v17-renderer
