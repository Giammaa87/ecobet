              fx = copy.deepcopy(fxwrap['fixture'])
              s = SPECS[fid]
              htid, atid = fx['home_team_id'], fx['away_team_id']
              web_sources = copy.deepcopy(s['sources'])
              hbook = team_ebook(htid, web_sources)
              abook = team_ebook(atid, web_sources)
              evidence_catalog = {
                  'fixture': {'value':copy.deepcopy(fx),'evidence_type':'FIXTURE_CONTEXT','status':'FOUND','trust':'HIGH'},
                  'home_team_snapshot': {'value':copy.deepcopy(team_refs[htid]),'evidence_type':'FULL_TEAM_SNAPSHOT_PAYLOAD','status':'FOUND','trust':'HIGH'},
                  'away_team_snapshot': {'value':copy.deepcopy(team_refs[atid]),'evidence_type':'FULL_TEAM_SNAPSHOT_PAYLOAD','status':'FOUND','trust':'HIGH'},
                  'web_context': {'value':{'context_evidence':copy.deepcopy(s['repair_context']),'sources':copy.deepcopy(web_sources)},'evidence_type':'POINT_IN_TIME_WEB_CONTEXT','status':'FOUND','trust':'MIXED_HIGH_MEDIUM'},
