          def eligible_features(payload):
              fs = payload.get('feature_state') or {}
              out = {}
              for k,v in fs.items():
                  lk = k.lower()
                  if k in FORBIDDEN_ODDS_KEYS or 'odds' in lk or 'bookmaker' in lk or lk.startswith('imp_') or lk.startswith('implied_prob_'):
                      continue
                  if v is not None:
                      out[k] = v
              return out

          def team_ebook(tid, web_sources):
              raw = team_payloads[tid]
              features = eligible_features(raw)
              return {
                  'team_id': raw['team_id'],
                  'team_name': raw['team_name'],
                  'feature_cutoff': copy.deepcopy(raw.get('feature_cutoff')),
                  'features': features,
                  'feature_status': {
                      **copy.deepcopy(raw.get('feature_status',{})),
                      'embedded_reasoning_feature_count': len(features),
                      'canonical_feature_count': 1000,
                      'full_snapshot_payload_embedded': True,
                      'odds_fields_rejected_from_reasoning': True
                  },
                  'feature_lineage': copy.deepcopy(raw.get('feature_lineage')),
                  'snapshot_transport_reference': copy.deepcopy(team_refs[tid]),
                  'snapshot_payload': copy.deepcopy(raw),
                  'reasoning_exclusions': sorted(FORBIDDEN_ODDS_KEYS),
                  'external_context': copy.deepcopy(web_sources)
              }

          def candidate(cid, expr, axis, roles):
              return {
                  'candidate_id': cid,
                  'prediction_expression': expr,
                  'market_axis': axis,
                  'roles': roles,
                  'status': 'ELIGIBLE',
                  'p_raw': 'NOT_AVAILABLE',
                  'wfrd': 'NOT_AVAILABLE',
                  'candidate_score': 'NOT_AVAILABLE',
                  'robustness_basis': 'STRUCTURAL_NORM_BOUND_ONLY'
              }

          def axis_for(expr):
              e = expr.lower()
              if 'under' in e or 'over' in e or 'total goals' in e: return 'TOTAL_GOALS'
              if '(x2)' in e or '(1x)' in e: return 'DOUBLE_CHANCE'
              if 'draw no bet' in e: return 'DNB'
              if e == 'draw': return 'MATCH_RESULT'
              if 'to win' in e: return 'MATCH_RESULT'
              return 'OTHER'

          def stage_provenance():
              reasoning = {'STRENGTH_MODEL_BUILD','FOOTBALL_INTERPRETATION_BUILD','MATCHBOOK_MODEL_BUILD','PRIME_WORLD_BUILD','COUNTERWORLD_BUILD','GAME_STATE_TAIL_RISK_BUILD','SCORE_DISTRIBUTION_BUILD','PREDICTION_MAP_BUILD','CONFIRMATION_CHECK','CANDIDATE_SCORING','PATHS_BUILD','FAVOURITE_DECISION','AMPEL_AND_FLAGS'}
              stages = ['MATCH_CONTEXT_OPEN','DATA_FABRIC_EXECUTE','TEAM_EBOOK_A_BUILD','TEAM_EBOOK_B_BUILD','MATCH_EBOOK_BUILD','STRENGTH_MODEL_BUILD','FOOTBALL_INTERPRETATION_BUILD','MATCHBOOK_MODEL_BUILD','PRIME_WORLD_BUILD','COUNTERWORLD_BUILD','GAME_STATE_TAIL_RISK_BUILD','SCORE_DISTRIBUTION_BUILD','PREDICTION_MAP_BUILD','CONFIRMATION_CHECK','CANDIDATE_SCORING','PATHS_BUILD','FAVOURITE_DECISION','PROBABILITY_BAND_BUILD','MODEL_PRICE_BAND_BUILD','AMPEL_AND_FLAGS','MATCH_VALIDATION','MATCH_COMMIT']
              return {s:{'execution_mode':'NORM_BOUND_REASONING' if s in reasoning else 'DETERMINISTIC','authority_bundle_id':AUTHORITY['authority_bundle_id'],'contract_id':CONTRACT_ID,'contract_sha256':CONTRACT_SHA,'reasoning_profile_id':PROFILE_ID,'reasoning_profile_hash':PROFILE_HASH,'provider':PROVIDER,'timestamp':RUN_TIME} for s in stages}

          matches=[]
          for fid in ['DISC_ac9f7a42d5d4','DISC_dd0d2eae4666','DISC_3f77134123fb','DISC_7d297721d5e6']:
