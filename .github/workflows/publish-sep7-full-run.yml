          if-no-files-found: error
          retention-days: 7

      - name: Commit full run and index
        shell: bash
        run: |
          git config user.name 'ecobet-publisher-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add runs/2026-09-07_0902.json runs/index.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish ECOBET run 2026-09-07_0902'
