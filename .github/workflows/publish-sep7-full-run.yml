              paths={
                  'safe':{'available':True,'prediction_expression':s['safe'],'candidate_id':f'{fid}:SAFE'},
                  'balanced':{'available':True,'prediction_expression':s['balanced'],'candidate_id':f'{fid}:BALANCED'},
                  'aggressive':{'available':True,'prediction_expression':s['aggressive'],'candidate_id':f'{fid}:AGGRESSIVE'}
              }
              repair_result={'status':s['repair_status'],'mode':s['data_source_mode'],'context_evidence':copy.deepcopy(s['repair_context']),'sources':copy.deepcopy(web_sources) if s['repair_status']=='COMPLETED' else []}
              structured={
