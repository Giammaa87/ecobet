          if latest['n_fixtures']!=25 or latest['n_teams']!=50: errors.append('snapshot_counts')
          if errors:
              Path('audits/manual_run_audit_2026-09-12.json').write_text(json.dumps({'status':'BLOCKED','errors':errors},indent=2)+'\n',encoding='utf-8')
              raise SystemExit('PUBLICATION BLOCKED: '+repr(errors[:20]))

          outfile.write_text(json.dumps(doc,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          run_hash='sha256:'+hashlib.sha256(outfile.read_bytes()).hexdigest()
          audit={'status':'APPROVED','publication_gate':'PASS','date':DATE,'run_id':run_id,'run_file':str(outfile),'run_sha256':run_hash,'snapshot_id':SID,'snapshot_hash':latest['data_hash'],'fixtures_expected':25,'fixtures_built':len(matches),'unique_fixture_ids':len({m['fixture_id'] for m in matches}),'team_ebooks_built':50,'match_ebooks_built':25,'stage_outputs_per_match':len(stages),'safe_paths_complete':sum(bool(m['safe']) for m in matches),'balanced_paths_complete':sum(bool(m['balanced']) for m in matches),'aggressive_paths_complete':sum(bool(m['aggressive']) for m in matches),'favourites_complete':sum(bool(m['favourite']) for m in matches),'clubelo_status':'NOT_AVAILABLE','clubelo_role':'sanity_check_only_not_primary_model_input','public_team_news_role':'sanity_check_only_no_numeric_model_reweight','ampel_distribution':pow['ampel_distribution'],'world_stability_distribution':pow['world_stability_distribution'],'record_type':doc['record_type'],'official_production_run':False,'note':'Manual snapshot-bound replacement for failed/unfinished production run. Not labeled as official Production Runner output.'}
          audit_path=Path('audits/manual_run_audit_2026-09-12.json')
