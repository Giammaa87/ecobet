name: One-time manual input 2026-09-13

on:
  push:
    paths:
      - '.github/workflows/manual-input-20260913.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract compact ECOBET decision input
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, io, json
          from pathlib import Path

          DATE='2026-09-13'; SID='snap_20260913_030840'; base=Path('data')/DATE/SID
          latest=json.loads((Path('data')/DATE/'latest.json').read_text(encoding='utf-8'))
          fixtures=json.loads((base/'fixtures.json').read_text(encoding='utf-8'))['fixtures']

          suffixes=['last5_current_season_n','last5_current_season_ppg','last5_current_season_goals_for_avg','last5_current_season_goals_against_avg','last5_current_season_shots_for_avg','last5_current_season_shots_against_avg','last5_current_season_shots_on_target_for_avg','last5_current_season_shots_on_target_against_avg','last5_current_season_btts_avg','last5_current_season_over_1.5_avg','last5_current_season_over_2.5_avg','last5_current_season_under_3.5_avg','last10_cross_season_ppg','last10_cross_season_goals_for_avg','last10_cross_season_goals_against_avg','last10_cross_season_xg_for_avg','last10_cross_season_xg_against_avg','last10_cross_season_btts_avg','last10_cross_season_over_1.5_avg','last10_cross_season_over_2.5_avg','last10_cross_season_under_3.5_avg','home_last5_cross_season_ppg','home_last5_cross_season_goals_for_avg','home_last5_cross_season_goals_against_avg','home_last5_cross_season_xg_for_avg','home_last5_cross_season_xg_against_avg','home_last5_cross_season_btts_avg','home_last5_cross_season_over_1.5_avg','home_last5_cross_season_over_2.5_avg','away_last5_cross_season_ppg','away_last5_cross_season_goals_for_avg','away_last5_cross_season_goals_against_avg','away_last5_cross_season_xg_for_avg','away_last5_cross_season_xg_against_avg','away_last5_cross_season_btts_avg','away_last5_cross_season_over_1.5_avg','away_last5_cross_season_over_2.5_avg','last10_all_competitions_ppg','last10_all_competitions_goals_for_avg','last10_all_competitions_goals_against_avg','last10_all_competitions_xg_for_avg','last10_all_competitions_xg_against_avg']

          def flatten(o,p=''):
              out={}
              if isinstance(o,dict):
                  for k,v in o.items():
                      q=f'{p}.{k}' if p else k
                      if 'feature_lineage' not in q.lower(): out.update(flatten(v,q))
              elif isinstance(o,list): pass
              elif isinstance(o,(int,float,bool)) or o is None: out[p]=o
              return out
          cache={}
          def metrics(ref):
              if ref not in cache:
                  flat=flatten(json.loads((base/ref).read_text(encoding='utf-8')))
                  d={}
                  for s in suffixes:
                      hits=[(k,v) for k,v in flat.items() if k.endswith(s)]
                      if hits: d[s]=sorted(hits,key=lambda kv:len(kv[0]))[0][1]
                  cache[ref]=d
              return cache[ref]

          rows=[]
          for item in fixtures:
              f=item['fixture']; hm=metrics(item['home_team']['ref']); am=metrics(item['away_team']['ref'])
              rows.append({'fixture':f,'home_ref':item['home_team']['ref'],'away_ref':item['away_team']['ref'],'home_metrics':hm,'away_metrics':am})
          out={'status':'PASS','date':DATE,'snapshot_id':SID,'snapshot_hash':latest['data_hash'],'data_cutoff':latest['data_cutoff'],'fixture_count':len(rows),'matches':rows}
          dest=Path('audits/manual_input_2026-09-13.json'); dest.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if len(rows)!=14: raise SystemExit(f'Expected 14 fixtures, got {len(rows)}')
          print('PASS fixtures',len(rows),'bytes',dest.stat().st_size)
          PY
      - name: Commit compact manual input
        shell: bash
        run: |
          git config user.name 'ecobet-manual-run-bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          git add audits/manual_input_2026-09-13.json
          git diff --cached --quiet && exit 0
          git commit -m 'Prepare compact manual run input for 2026-09-13'
          git push
