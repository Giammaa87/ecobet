name: ECOBET v1.4 display safe patch

on:
  push:
    branches:
      - ecobet-v14-display-safe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ecobet-v14-display-safe
          fetch-depth: 0
      - name: Apply compatibility patch
        run: python tools/patch_index_v14_display.py
      - name: Validate expected additions and existing loaders
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          checks={
            'run loader': "const RUNS='runs/';",
            'data loader': "const DATA='data/';",
            'audit loader': "const AUDITS='audits/';",
            'detail renderer': 'function renderMatchDetail',
            'team ebook compatibility': 'teamFieldLabel',
            'v1.4 candidate axis': 'market_axis',
            'v1.4 candidate world': 'supported_world',
            'field status section': 'Datenfelder · DF01–DF16',
            'favourite reason': 'favourite_decision_reason',
            'world object renderer': 'worldText=(world,detail)',
          }
          missing=[name for name,needle in checks.items() if needle not in s]
          if missing:
              raise SystemExit('Missing expected markers: '+', '.join(missing))
          if s.count('function renderMatchDetail') != 1:
              raise SystemExit('renderMatchDetail count changed unexpectedly')
          print('Validation PASS')
          PY
      - name: Commit staged index only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Expand match detail display for run schema v1.4"
          git push origin HEAD:ecobet-v14-display-safe
