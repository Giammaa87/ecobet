name: ECOBET football interpretation fallback

on:
  push:
    branches:
      - ecobet-v14-display-safe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ecobet-v14-display-safe
          fetch-depth: 0
      - name: Apply football interpretation fallback
        run: python tools/patch_football_interpretation_fallback.py
      - name: Validate structure and JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            'function renderMatchDetail',
            "const RUNS='runs/';",
            "const DATA='data/';",
            "const AUDITS='audits/';",
            'Spielmechanismus · PRIME',
            'Gegenmechanismus · COUNTER',
            'Strukturierte Interpretationsachsen sind in diesem Run nicht verfügbar.',
            'm.football_interpretation?.summary',
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing markers: '+', '.join(missing))
          print('structure=PASS')
          PY
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(x=>x.trim());
          if(!scripts.length) throw new Error('No inline scripts found');
          for(const code of scripts) new Function(code);
          console.log('inline_javascript_syntax=PASS');
          NODE
      - name: Commit index only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add football interpretation fallback"
          git push origin HEAD:ecobet-v14-display-safe
