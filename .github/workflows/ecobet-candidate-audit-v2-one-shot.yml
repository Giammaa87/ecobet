name: ECOBET one-shot candidate audit v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ecobet-candidate-audit-v2-one-shot.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/candidate-audit-v2
          fetch-depth: 0

      - name: Apply guarded candidate audit patch
        run: |
          set -euo pipefail
          python .github/ecobet_candidate_audit_patch.py
          rm .github/ecobet_candidate_audit_patch.py
          git diff --check
          grep -F 'function candidateAuditRoot(m)' index.html >/dev/null
          grep -F 'Vollständiger Kandidaten-Audit' index.html >/dev/null
          grep -F 'Entscheidungspfad-Prüfung' index.html >/dev/null

      - name: Validate app JavaScript
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          marker='<script>\nconst BASE ='
          a=s.index(marker)+len('<script>\n')
          b=s.index('</script>',a)
          Path('/tmp/ecobet-app.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/ecobet-app.js

      - name: Commit patch branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/ecobet_candidate_audit_patch.py
          git commit -m "Restore full candidate audit with path fallback"
          git push origin HEAD:fix/candidate-audit-v2
