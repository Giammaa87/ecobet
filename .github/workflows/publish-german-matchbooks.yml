name: ECOBET German Match Book publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '35 3,6,10,15,20 * * *'
  push:
    branches: [main]
    paths:
      - 'stage13/source-records/*.stage12.json'
      - 'runs/index.json'
      - '.github/workflows/publish-german-matchbooks.yml'
      - 'tools/publish_german_matchbooks.py'
      - 'tools/tests/test_german_matchbooks.py'

permissions:
  contents: write

concurrency:
  group: ecobet-website-derived-indexes-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache local translation model and package downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/share/argos-translate
            ~/.argos-translate
          key: ecobet-argos-translate-en-de-python312-v1
      - name: Check publishing script
        run: |
          python -m py_compile tools/publish_german_matchbooks.py
          python -m unittest discover -s tools/tests -p 'test_german_matchbooks.py' -v
      - name: Install local English German translation engine
        run: python -m pip install 'argostranslate>=1.9,<2'
      - name: Verify real English to German football translation and numeric integrity
        shell: bash
        run: |
          python - <<'PY'
          from tools.publish_german_matchbooks import translated, translator_model
          source = "Everton create 1.65 xG but score only 0.6 goals. One or two goals remain possible."
          german = translated(source, translator_model())
          assert "1.65" in german and "0.6" in german, german
          assert german != source, "The translator did not return German text"
          print("Translation verified with immutable original numerals:", german)
          PY
      - name: Generate translated narratives from frozen Stage12 records
        run: python tools/publish_german_matchbooks.py . --lookback-days 7 --max-runs 10 --since-date 2026-11-07
      - name: Publish generated German narratives without changing predictions
        shell: bash
        run: |
          git config user.name "ecobet-matchbook-translation-bot"
          git config user.email "ecobet-matchbook-translation-bot@users.noreply.github.com"
          git add -- translations/matchbooks
          if git diff --cached --quiet; then
            echo "No translations to publish"
            exit 0
          fi
          git commit -m "website: publish automatic German Match Books"
          git pull --rebase origin main
          git push origin HEAD:main
