name: Refresh ECOBET website derived indexes

on:
  push:
    branches: [main]
    paths:
      - 'audits/**'
      - 'corrections/audits/**'
      - 'data/**'
      - 'tools/build_website_phase1_indexes.py'
      - 'tools/validate_website_phase1.py'
      - 'tools/tests/test_performance_competitions.py'

permissions:
  contents: write

concurrency:
  group: ecobet-website-derived-indexes-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression test exact football competition binding
        run: python -m unittest discover -s tools/tests -p 'test_performance_competitions.py' -v
      - name: Build immutable indexes from published evidence
        run: python tools/build_website_phase1_indexes.py .
      - name: Verify source bindings and settlement equivalence
        run: python tools/validate_website_phase1.py .
      - name: Commit validated derived indexes
        shell: bash
        run: |
          git config user.name 'ecobet-website-index-bot'
          git config user.email 'ecobet-website-index-bot@users.noreply.github.com'
          git add -- performance team-form
          if git diff --cached --quiet; then
            echo 'No derived index update required.'
            exit 0
          fi
          git commit -m 'website: refresh derived indexes'
          git pull --rebase origin main
          git push origin HEAD:main
