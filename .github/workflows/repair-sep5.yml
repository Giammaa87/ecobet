name: One-time apply index V3.3

on:
  push:
    paths:
      - 'runs/.index_v33_trigger'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify V3.2 base
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object index.html)"
          expected="204ab2d629e1a61b5520fe642f1186ac2a0f975e"
          echo "current index blob: $actual"
          test "$actual" = "$expected"

      - name: Apply audited V3.2 to V3.3 patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            runs/.index_v33_patch_01 \
            runs/.index_v33_patch_02 \
            runs/.index_v33_patch_03 \
            runs/.index_v33_patch_04 \
            runs/.index_v33_patch_05 \
            | tr -d '\n\r' \
            | base64 -d > /tmp/index_v33.patch
          patch --batch -p0 < /tmp/index_v33.patch
          actual="$(git hash-object index.html)"
          expected="c51cdd95611741467e4ba27ca0c32d616b1cf75c"
          echo "patched index blob: $actual"
          test "$actual" = "$expected"

      - name: Commit V3.3 and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ecobet-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git rm -f \
            runs/.index_v33_patch_01 \
            runs/.index_v33_patch_02 \
            runs/.index_v33_patch_03 \
            runs/.index_v33_patch_04 \
            runs/.index_v33_patch_05 \
            runs/.index_v33_trigger
          git commit -m 'Fix effective decision paths in index'
          git push
