name: Publish gated manual run 2026-09-13 retry

on:
  push:
    paths:
      - '.github/workflows/publish-manual-run-20260913.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Execute already-gated builder logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          src=Path('.github/workflows/build-manual-run-20260913.yml').read_text(encoding='utf-8')
          marker="python3 - <<'PY'\n"
          if marker not in src:
              raise SystemExit('BLOCKED: builder python block not found')
          block=src.split(marker,1)[1].split("\n          PY",1)[0]
          Path('/tmp/ecobet_build_20260913.py').write_text(textwrap.dedent(block),encoding='utf-8')
          print('BUILDER_EXTRACT PASS',len(block))
          PY
          python3 /tmp/ecobet_build_20260913.py

      - name: Independent final gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          ptr=json.loads(Path('audits/manual_run_pointer_2026-09-13.json').read_text(encoding='utf-8'))
          run=json.loads(Path(ptr['run_file']).read_text(encoding='utf-8'))
          audit=json.loads(Path(ptr['audit_file']).read_text(encoding='utf-8'))
          snap=json.loads(Path('data/2026-09-13/snap_20260913_030840/fixtures.json').read_text(encoding='utf-8'))
          idx=json.loads(Path('runs/index.json').read_text(encoding='utf-8'))
          expected={x['fixture']['fixture_id'] for x in snap['fixtures']}
          actual={x['fixture_id'] for x in run['matches']}
          assert audit['status']=='APPROVED' and audit['publication_gate']=='PASS'
          assert len(run['matches'])==14 and expected==actual
          assert run['proof_of_work']['team_ebooks_built']==28
          assert run['proof_of_work']['match_ebooks_built']==14
          assert run['run']['snapshot_id']=='snap_20260913_030840'
          assert run['run']['official_production_run'] is False
          assert ptr['run_id'] in idx['dates']['2026-09-13']
          assert all(m['safe'] and m['balanced'] and m['aggressive'] and m['favourite'] for m in run['matches'])
          print('FINAL_GATE PASS',ptr['run_id'])
          PY

      - name: Cleanup one-time scaffolding
        shell: bash
        run: |
          rm -f \
            .github/workflows/manual-clubelo-table-20260913.yml \
            .github/workflows/manual-input-20260913.yml \
            .github/workflows/manual-summary-20260913.yml \
            .github/workflows/build-manual-run-20260913.yml \
            .github/workflows/publish-manual-run-20260913.yml \
            audits/manual_clubelo_table_2026-09-13.csv \
            audits/manual_clubelo_meta_2026-09-13.json \
            audits/manual_input_2026-09-13.json \
            audits/manual_summary_2026-09-13.csv

      - name: Commit and publish approved run
        shell: bash
        run: |
          git config user.name 'ecobet-manual-run-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          RUN_ID=$(python3 -c "import json;print(json.load(open('audits/manual_run_pointer_2026-09-13.json'))['run_id'])")
          git diff --cached --quiet && exit 0
          git commit -m "Publish gated ECOBET manual run ${RUN_ID}"
          git push
