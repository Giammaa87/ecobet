name: One-time ClubElo decision table 2026-09-12

on:
  push:
    paths:
      - '.github/workflows/manual-clubelo-table-20260912.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compact table and ClubElo shock check
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, io, json, re, urllib.request
          from pathlib import Path
          from difflib import SequenceMatcher

          DATE='2026-09-12'; SID='snap_20260912_030836'; base=Path('data')/DATE/SID
          fixtures=json.loads((base/'fixtures.json').read_text(encoding='utf-8'))['fixtures']

          def flatten(o,p=''):
              out={}
              if isinstance(o,dict):
                  for k,v in o.items():
                      q=f'{p}.{k}' if p else k
                      out.update(flatten(v,q))
              elif isinstance(o,list):
                  pass
              elif isinstance(o,(int,float,bool)) or o is None:
                  out[p]=o
              return out

          cache={}
          def getflat(ref):
              if ref not in cache:
                  cache[ref]=flatten(json.loads((base/ref).read_text(encoding='utf-8')))
              return cache[ref]
          def metric(ref,suffix):
              flat=getflat(ref)
              hits=[(k,v) for k,v in flat.items() if 'feature_lineage' not in k.lower() and k.endswith(suffix)]
              return sorted(hits,key=lambda x:len(x[0]))[0][1] if hits else None

          # ClubElo historical daily dataset; sanity check only.
          raw=''; source=''
          for url in [f'http://api.clubelo.com/{DATE}',f'https://api.clubelo.com/{DATE}']:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode('utf-8-sig',errors='replace')
                  if raw.strip(): source=url; break
              except Exception as e:
                  print('ClubElo fetch failed',url,repr(e))
          ratings=[]
          if raw.strip():
              reader=csv.DictReader(io.StringIO(raw))
              for row in reader:
                  try: elo=float(row.get('Elo') or row.get('elo') or '')
                  except: continue
                  club=row.get('Club') or row.get('club') or row.get('Team') or ''
                  if club: ratings.append((club,elo))
          print('ClubElo rows',len(ratings),'source',source)

          def norm(s): return re.sub(r'[^a-z0-9]','',s.lower().replace('ü','u').replace('ö','o').replace('ä','a').replace('ß','ss'))
          aliases={
            'afcbournemouth':'Bournemouth','manchestercity':'Man City','manchesterunited':'Man United','nottinghamforest':'Nottm Forest','crystalpalace':'Crystal Palace','ipswichtown':'Ipswich','hullcity':'Hull',
            'bayer04leverkusen':'Leverkusen','sportclubfreiburg':'Freiburg','borussiamonchengladbach':'Gladbach','bayernmunich':'Bayern','borussiadortmund':'Dortmund','eintrachtfrankfurt':'Frankfurt','fcaugsburg':'Augsburg','rbleipzig':'RB Leipzig','svwerderbremen':'Werder Bremen',
            'parissaintgermain':'Paris SG','olympiquedemarseille':'Marseille','asmonaco':'Monaco','olympiquelyonnais':'Lyon','losclille':'Lille','ogcnice':'Nice',
            'inter':'Inter','acmilan':'Milan','juventus':'Juventus','napoli':'Napoli','atalanta':'Atalanta','roma':'Roma','lazio':'Lazio','fiorentina':'Fiorentina','bologna':'Bologna','como':'Como',
            'realmadrid':'Real Madrid','barcelona':'Barcelona','atleticomadrid':'Atletico','athleticclub':'Athletic Bilbao','realsociedad':'Sociedad','villarreal':'Villarreal','realbetis':'Betis','sevilla':'Sevilla','valencia':'Valencia'
          }
          bynorm={norm(c):(c,e) for c,e in ratings}
          def elo_for(name):
              n=norm(name); target=aliases.get(n,name); tn=norm(target)
              if tn in bynorm: return bynorm[tn][1],bynorm[tn][0],1.0
              best=(0,None,None)
              for c,e in ratings:
                  sc=SequenceMatcher(None,tn,norm(c)).ratio()
                  if sc>best[0]: best=(sc,c,e)
              if best[0]>=0.72: return best[2],best[1],best[0]
              return None,None,best[0]

          fields=['id','ko','comp','home','away','h_cur_n','a_cur_n','h_cur_ppg','a_cur_ppg','h_cross_ppg','a_cross_ppg','h_venue_ppg','a_venue_ppg','h_cur_gf','a_cur_gf','h_cur_ga','a_cur_ga','h_cross_xg','a_cross_xg','h_cross_xga','a_cross_xga','h_venue_xg','a_venue_xg','h_venue_xga','a_venue_xga','h_cur_o25','a_cur_o25','h_cross_o25','a_cross_o25','h_venue_o25','a_venue_o25','h_cur_btts','a_cur_btts','h_venue_btts','a_venue_btts','h_cur_shots','a_cur_shots','h_cur_sot','a_cur_sot','h_elo','a_elo','elo_delta','h_elo_match','a_elo_match']
          out=io.StringIO(); w=csv.DictWriter(out,fieldnames=fields); w.writeheader()
          for item in fixtures:
              f=item['fixture']; hr=item['home_team']['ref']; ar=item['away_team']['ref']
              he,hmatch,_=elo_for(f['home_team_name']); ae,amatch,_=elo_for(f['away_team_name'])
              row={
                'id':f['fixture_id'],'ko':f['kickoff'],'comp':f['competition_name'],'home':f['home_team_name'],'away':f['away_team_name'],
                'h_cur_n':metric(hr,'last5_current_season_n'),'a_cur_n':metric(ar,'last5_current_season_n'),
                'h_cur_ppg':metric(hr,'last5_current_season_ppg'),'a_cur_ppg':metric(ar,'last5_current_season_ppg'),
                'h_cross_ppg':metric(hr,'last10_cross_season_ppg'),'a_cross_ppg':metric(ar,'last10_cross_season_ppg'),
                'h_venue_ppg':metric(hr,'home_last5_cross_season_ppg'),'a_venue_ppg':metric(ar,'away_last5_cross_season_ppg'),
                'h_cur_gf':metric(hr,'last5_current_season_goals_for_avg'),'a_cur_gf':metric(ar,'last5_current_season_goals_for_avg'),
                'h_cur_ga':metric(hr,'last5_current_season_goals_against_avg'),'a_cur_ga':metric(ar,'last5_current_season_goals_against_avg'),
                'h_cross_xg':metric(hr,'last10_cross_season_xg_for_avg'),'a_cross_xg':metric(ar,'last10_cross_season_xg_for_avg'),
                'h_cross_xga':metric(hr,'last10_cross_season_xg_against_avg'),'a_cross_xga':metric(ar,'last10_cross_season_xg_against_avg'),
                'h_venue_xg':metric(hr,'home_last5_cross_season_xg_for_avg'),'a_venue_xg':metric(ar,'away_last5_cross_season_xg_for_avg'),
                'h_venue_xga':metric(hr,'home_last5_cross_season_xg_against_avg'),'a_venue_xga':metric(ar,'away_last5_cross_season_xg_against_avg'),
                'h_cur_o25':metric(hr,'last5_current_season_over_2.5_avg'),'a_cur_o25':metric(ar,'last5_current_season_over_2.5_avg'),
                'h_cross_o25':metric(hr,'last10_cross_season_over_2.5_avg'),'a_cross_o25':metric(ar,'last10_cross_season_over_2.5_avg'),
                'h_venue_o25':metric(hr,'home_last5_cross_season_over_2.5_avg'),'a_venue_o25':metric(ar,'away_last5_cross_season_over_2.5_avg'),
                'h_cur_btts':metric(hr,'last5_current_season_btts_avg'),'a_cur_btts':metric(ar,'last5_current_season_btts_avg'),
                'h_venue_btts':metric(hr,'home_last5_cross_season_btts_avg'),'a_venue_btts':metric(ar,'away_last5_cross_season_btts_avg'),
                'h_cur_shots':metric(hr,'last5_current_season_shots_for_avg'),'a_cur_shots':metric(ar,'last5_current_season_shots_for_avg'),
                'h_cur_sot':metric(hr,'last5_current_season_shots_on_target_for_avg'),'a_cur_sot':metric(ar,'last5_current_season_shots_on_target_for_avg'),
                'h_elo':he,'a_elo':ae,'elo_delta':(he-ae if he is not None and ae is not None else None),'h_elo_match':hmatch,'a_elo_match':amatch
              }
              w.writerow(row)
          p=Path('audits/manual_clubelo_table_2026-09-12.csv'); p.write_text(out.getvalue(),encoding='utf-8')
          meta={'status':'PASS' if len(fixtures)==25 else 'FAIL','clubelo_source':source or None,'clubelo_rows':len(ratings),'fixture_count':len(fixtures),'role':'sanity_check_only_not_primary_model_input'}
          Path('audits/manual_clubelo_meta_2026-09-12.json').write_text(json.dumps(meta,indent=2)+'\n',encoding='utf-8')
          print(meta,'csv bytes',p.stat().st_size)
          PY
      - name: Commit compact ClubElo table
        shell: bash
        run: |
          git config user.name 'ecobet-manual-run-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add audits/manual_clubelo_table_2026-09-12.csv audits/manual_clubelo_meta_2026-09-12.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add 2026-09-12 ClubElo shock-check table'
          git push
