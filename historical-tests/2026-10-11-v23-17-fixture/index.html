<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECOBET · Historischer V2.3 Test</title><style>
:root{--bg:#071117;--panel:#0d202a;--line:#2f5969;--text:#e9f3f5;--muted:#a4b8c1;--ok:#37e39b;--warn:#f3c76a;--bad:#ff8e8e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#071117,#0b1820);color:var(--text);font:15px/1.55 system-ui,sans-serif}header,main{max-width:1240px;margin:auto;padding:24px}.eyebrow{color:var(--warn);font:800 12px ui-monospace,monospace;letter-spacing:.12em}.notice{margin:15px 0;padding:12px 15px;border:1px solid #916f2b;background:#2a2417;color:#ffe7af;border-radius:10px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.metric,.fixture{background:rgba(13,32,42,.94);border:1px solid var(--line);border-radius:12px;padding:14px}.metric strong{font-size:28px;display:block}.table{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:840px}th,td{padding:10px;text-align:left;border-bottom:1px solid #1c3743;vertical-align:top}th{color:var(--muted);font-size:12px}.ok{color:var(--ok)}.warn{color:var(--warn)}.nsp{color:var(--muted);font-style:italic}.fixtures{display:grid;gap:14px;margin:24px 0}.fixture h2{margin:0 0 4px;font-size:20px}.fixture p{margin:8px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.box{border-left:3px solid var(--line);padding:4px 10px;background:#091820}.box h3{margin:0;color:var(--warn);font-size:13px}.box ul{padding-left:18px;margin:6px 0}.meta{font:12px/1.45 ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere}.chip{display:inline-block;padding:2px 7px;margin:2px;border-radius:999px;background:#17313d;color:#cdebf3;font-size:12px}.foot{color:var(--muted);font-size:13px}@media(max-width:750px){.metrics,.grid{grid-template-columns:1fr}header,main{padding:16px}}
</style></head><body><header><div class="eyebrow">ECOBET V2.3 · HISTORICAL TEST ARCHIVE</div><h1>17‑Fixture Football Prediction Board</h1><div class="notice">Nicht-produktiver statischer Test. Kein Stage 13, kein Freeze-Gate, kein Scheduler und kein Produktions-Run. DIAGNOSTIC_ONLY ist keine veröffentlichte Prediction.</div><div class="metrics" id="metrics"></div></header><main><section class="table"><table><thead><tr><th>Fixture</th><th>Anpfiff</th><th>Status</th><th>SAFE</th><th>BALANCED</th><th>AGGRESSIVE</th><th>FAVOURITE</th></tr></thead><tbody id="overview"></tbody></table></section><section class="fixtures" id="details"></section><p class="foot" id="provenance"></p></main><script>
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=x=>Array.isArray(x)?x.map(text).join('; '):typeof x==='object'&&x?Object.entries(x).map(([k,v])=>`${k}: ${text(v)}`).join('; '):String(x??'');
const decision=d=>d.status==='AVAILABLE'?e(d.market):`<span class="nsp">NSP — ${e(d.reason||'no stable prediction')}</span>`;
const list=x=>Array.isArray(x)&&x.length?`<ul>${x.map(v=>`<li>${e(typeof v==='string'?v:text(v))}</li>`).join('')}</ul>`:'<span class="nsp">Keine Angabe</span>';
function validate(a){if(a.fixtures.length!==17)throw Error('fixture count');const q=a.fixtures.filter(x=>x.qualification.status==='QUALIFIED').length,d=a.fixtures.filter(x=>x.qualification.status==='DIAGNOSTIC_ONLY').length;if(q!==8||d!==9)throw Error('qualification');for(const f of a.fixtures)for(const x of Object.values(f.decisions))if(x.status==='NSP'&&(x.market||x.candidate_id))throw Error('NSP market violation')}
fetch('./adapter.json',{cache:'no-store'}).then(r=>r.json()).then(a=>{validate(a);const q=a.fixtures.filter(x=>x.qualification.status==='QUALIFIED').length,d=a.fixtures.length-q;document.querySelector('#metrics').innerHTML=`<div class="metric"><small>Fixtures</small><strong>${a.fixtures.length}</strong><span>eine gemeinsame Adapterquelle</span></div><div class="metric"><small>Qualified prematch</small><strong class="ok">${q}</strong><span>historisch qualifizierte Paths</span></div><div class="metric"><small>Diagnostic only</small><strong class="warn">${d}</strong><span>keine Produktionsfreigabe</span></div>`;document.querySelector('#overview').innerHTML=a.fixtures.map(f=>`<tr><td>${e(f.fixture.home_team_name)} – ${e(f.fixture.away_team_name)}</td><td>${e(f.fixture.kickoff)}</td><td class="${f.qualification.status==='QUALIFIED'?'ok':'warn'}">${e(f.qualification.status)}</td>${['safe','balanced','aggressive','favourite'].map(k=>`<td>${decision(f.decisions[k])}</td>`).join('')}</tr>`).join('');document.querySelector('#details').innerHTML=a.fixtures.map(f=>{const c=f.football;const accepted=c.candidates.accepted.map(x=>x.market).join(' · ')||'—';const rejected=c.candidates.rejected.map(x=>x.market).join(' · ')||'—';const primary=c.worlds.primary_world?.world_id||'—';const competing=c.worlds.competing_world?.world_id||'—';const review=f.structural_review||{};return `<article class="fixture"><div class="eyebrow">${e(f.qualification.status)} · ${e(f.fixture.fixture_id)}</div><h2>${e(f.fixture.home_team_name)} – ${e(f.fixture.away_team_name)}</h2><p><b>Match Thesis:</b> ${e(c.match_thesis.central_mechanism)}</p><div class="grid"><div class="box"><h3>Entscheidungen</h3><p>SAFE: ${decision(f.decisions.safe)}<br>BALANCED: ${decision(f.decisions.balanced)}<br>AGGRESSIVE: ${decision(f.decisions.aggressive)}<br>FAVOURITE: ${decision(f.decisions.favourite)}</p></div><div class="box"><h3>Worlds & Score Cluster</h3><p><span class="chip">${e(primary)}</span><span class="chip">${e(competing)}</span><br>${e(c.score_state_cluster.central_corridor)}</p></div><div class="box"><h3>Gültige Candidates</h3><p>${e(accepted)}</p><h3>Abgelehnt</h3><p>${e(rejected)}</p></div><div class="box"><h3>Structural Review</h3><p>${e(review.outcome||'NOT_RECORDED')} — ${e(review.rationale||'No structural review record supplied.')}</p></div></div><details><summary>Football Evidence & Provenance</summary><div class="meta"><p>Target: ${e(f.provenance.target.content_hash)}<br>Primary: ${e(f.provenance.primary.file_sha256)}<br>Chain: ${e(f.provenance.decision_chain.chain_hash)}</p><h3>Team Books</h3>${list([c.team_books.home.observations,c.team_books.away.observations])}<h3>Break Mechanisms</h3>${list(c.match_thesis.break_mechanisms)}<h3>Scorelines</h3>${list(c.score_state_cluster.scorelines)}</div></details></article>`}).join('');document.querySelector('#provenance').textContent=`Adapter ${a.adapter_content_hash} · source board ${a.source_board.file_sha256} · static route consumes adapter.json only.`;window.__ECOBET_HISTORICAL_TEST__={fixtureCount:a.fixtures.length,qualified:q,diagnosticOnly:d,source:'adapter.json',productionMutation:false};}).catch(err=>{document.body.innerHTML+=`<p class="notice">Render error: ${e(err.message)}</p>`;throw err});
</script></body></html>
